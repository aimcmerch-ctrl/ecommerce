<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIMCMERCH | Winter Collection 2026</title>
    <meta name="theme-color" content="#12161a">

    <!-- Fonts: Montserrat for both elegant light weights and massive bold display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;800;900&display=swap" rel="stylesheet">
    
    <!-- GSAP for smooth entrance animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        :root {
            /* Elegant, moody winter color palette (Slate, Ice, Cream) */
            --bg-deep: #12161a;
            --bg-light: #1f2731;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #e0f2fe;
            --font-main: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow: hidden;
            position: relative;
        }

        /* --- ATMOSPHERIC BACKGROUND --- */
        .bg-layer {
            position: absolute;
            inset: -5%; /* Slight bleed for scaling animation */
            z-index: 1;
            /* High-end abstract atmospheric image from Unsplash */
            background-image: url('https://images.unsplash.com/photo-1478265409131-1f65c88f965c?q=80&w=2500&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            will-change: transform;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(
                to bottom,
                rgba(18, 22, 26, 0.2) 0%,
                rgba(18, 22, 26, 0.8) 60%,
                rgba(18, 22, 26, 1) 100%
            );
        }

        /* --- SOFT BOKEH SNOW CANVAS --- */
        #snow-canvas {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        /* --- CONTENT LAYOUT --- */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 4rem;
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .brand {
            font-weight: 900;
            letter-spacing: 4px;
        }

        .collection-tag {
            color: var(--text-muted);
        }

        /* MAIN CENTER TITLE */
        .center-stage {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .sub-heading {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .huge-title {
            font-size: clamp(4rem, 12vw, 12rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            margin: 0;
        }

        .huge-title span {
            display: block;
        }

        .huge-title .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }

        /* FOOTER / WAITLIST */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .footer-text {
            max-width: 300px;
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Elegant Input Form */
        .waitlist-form {
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 0.5rem;
            transition: border-color 0.3s ease;
        }

        .waitlist-form:focus-within {
            border-bottom-color: var(--text-main);
        }

        .waitlist-form input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.9rem;
            width: 250px;
            padding: 0.5rem 0;
        }

        .waitlist-form input::placeholder {
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        .waitlist-form button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            padding-left: 1rem;
            transition: color 0.3s ease;
        }

        .waitlist-form button:hover {
            color: var(--accent);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .content-wrapper {
                padding: 2rem 1.5rem;
            }
            .huge-title {
                margin-top: 2rem;
            }
            footer {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                text-align: center;
            }
            .waitlist-form input {
                width: 200px;
            }
            .collection-tag {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Deep atmospheric background -->
    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-gradient"></div>

    <!-- Soft blurred snow canvas -->
    <canvas id="snow-canvas"></canvas>

    <!-- Main Content -->
    <div class="content-wrapper">
        <header class="gsap-fade">
            <div class="brand">AIMCMERCH</div>
            <div class="collection-tag">Winter Collection</div>
        </header>

        <div class="center-stage">
            <div class="sub-heading gsap-fade">Coming Soon</div>
            <h1 class="huge-title">
                <span class="gsap-slide-up">WINTER</span>
                <span class="gsap-slide-up outline">2026</span>
            </h1>
        </div>

        <footer>
            <div class="footer-text gsap-fade">
                The new standard of campus wear. Join the exclusive waitlist to be notified the moment the collection drops.
            </div>
            
            <form class="waitlist-form gsap-fade" onsubmit="event.preventDefault(); this.innerHTML = '<span style=\'font-weight:500; letter-spacing:1px;\'>YOU ARE ON THE LIST.</span>';">
                <input type="email" placeholder="Enter your email address" required>
                <button type="submit">Notify Me</button>
            </form>
        </footer>
    </div>

    <script>
        // --------------------------------------------------------
        // 1. SOFT BOKEH SNOW EFFECT (Canvas)
        // Instead of sharp shapes, this creates soft, glowing out-of-focus 
        // orbs that drift gently, mimicking a high-end camera lens.
        // --------------------------------------------------------
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const flakes = [];
        const FLAKE_COUNT = 60; // Keep it sparse and elegant

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class BokehFlake {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : -50;
                
                // Depth dictates size, blur, and speed
                this.z = Math.random(); 
                this.radius = (this.z * 4) + 1; // Size 1px to 5px
                this.speed = (this.z * 0.5) + 0.2; // Very slow, graceful fall
                
                // Sway mechanics
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = (Math.random() - 0.5) * 0.01;
                
                // Opacity based on depth (larger = more out of focus/transparent)
                this.opacity = (1 - this.z) * 0.5 + 0.1;
            }

            update() {
                this.y += this.speed;
                this.angle += this.angleSpeed;
                this.x += Math.sin(this.angle) * 0.2;

                if (this.y > height + 50) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                // Create a soft radial gradient for the bokeh glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        for (let i = 0; i < FLAKE_COUNT; i++) {
            flakes.push(new BokehFlake());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            flakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // --------------------------------------------------------
        // 2. GSAP ENTRANCE ANIMATIONS
        // --------------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline();

            // Very slow, continuous scale on the background image for premium feel
            gsap.to('#bg-layer', {
                scale: 1.1,
                duration: 20,
                ease: 'none',
                repeat: -1,
                yoyo: true
            });

            // Text Animations
            tl.fromTo('.gsap-fade', 
                { opacity: 0, y: 15 },
                { opacity: 1, y: 0, duration: 1.2, stagger: 0.2, ease: 'power2.out', delay: 0.2 }
            );

            tl.fromTo('.gsap-slide-up',
                { opacity: 0, y: 50 },
                { opacity: 1, y: 0, duration: 1.2, stagger: 0.15, ease: 'power3.out' },
                "-=1" // overlap with previous animation
            );
        });
    </script>
</body>
</html>
